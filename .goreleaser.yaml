# Release build for rasp. Spec: design §14.
#
# This file only describes *how artifacts are built*. Tagging, publishing and pushing the
# cask to the tap belong to the release pipeline. `just snapshot` exercises everything here
# except those three.
version: 2

project_name: rasp

builds:
  - id: rasp
    main: ./cmd/rasp
    binary: rasp # goreleaser appends .exe on windows itself — never restate it
    env:
      - CGO_ENABLED=0 # load-bearing: one runner builds every target, and no cgo dependency can enter go.mod (§14)
    flags:
      - -trimpath
    # The leading v is a literal because .Version is the tag with its v stripped; writing it
    # back keeps a release reporting `rasp v1.2.3` rather than `rasp 1.2.3`. {{.Tag}} would
    # supply the v for free but cannot tell a release from a dev build: it is the most recent
    # tag either way, so once any tag exists every snapshot claims to be that release.
    # .Version degrades honestly instead — `1.2.3` tagged, `1.2.3-SNAPSHOT-<sha>` otherwise.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    # Archives are only byte-reproducible if the files inside them are: tar records each
    # entry's mtime, so an unpinned build time gives two runs of the same commit different
    # archive hashes. The commit's own timestamp is the deterministic stamp.
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # These two are exactly what goreleaser bundles by default; they are restated only to
    # carry an mtime, and naming them replaces the default glob rather than adding to it.
    # Without this the binary is stamped (builds.mod_timestamp) but these are not, and since
    # git does not record mtimes, every fresh clone dates them to checkout time and the
    # archive hash moves. RFC3339 here, not the epoch .CommitTimestamp used above: this field
    # parses a timestamp rather than passing it through, and rejects the epoch form.
    files:
      - src: LICENSE
        info: {mtime: '{{ .CommitDate }}'}
      - src: README.md
        info: {mtime: '{{ .CommitDate }}'}

checksum:
  name_template: checksums.txt

homebrew_casks:
  # NOT `brews:` — deprecated since goreleaser 2.10.
  - name: rasp
    homepage: https://github.com/theocod3s/rasp
    description: A terminal coding agent in Go
    repository:
      owner: theocod3s
      name: homebrew-tap
    # The binaries are unsigned and unnotarized, so Gatekeeper quarantines anything
    # downloaded by the cask and the first run dies with "cannot be opened". Stripping
    # the attribute on install is what the goreleaser docs prescribe for this case.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rasp"]
          end
